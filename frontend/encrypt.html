
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Encryption Page</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        #encrypt-text,
        #encrypt-key,
        #encrypt-output {
            text-transform: none !important;
            -webkit-text-size-adjust: 100%;
        }

        #encrypt-output {
            overflow-wrap: anywhere;
            user-select: text;
            -webkit-user-select: text;
        }
    </style>
</head>

<body>

    <div class="container">

        <header class="page-header">

            <a href="/" class="back-btn">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>

            <h1>
                <i class="fas fa-lock"></i> Encryption
            </h1>

            <p class="subtitle">
                Convert your text into secret code
            </p>

        </header>

        <div class="encryption-area">

            <div class="input-section">

                <h2>
                    <i class="fas fa-keyboard"></i> Text to Encrypt
                </h2>

                <textarea
                    id="encrypt-text"
                    placeholder="Type your message here..."
                    autocapitalize="off"
                    autocorrect="off"
                    spellcheck="false"
                    autocomplete="off"
                    style="text-transform: none;"
                ></textarea>

            </div>

            <div class="key-section">

                <h2>
                    <i class="fas fa-key"></i> Secret Key
                </h2>

                <input
                    type="password"
                    id="encrypt-key"
                    placeholder="Enter your secret key"
                    autocomplete="off"
                    autocapitalize="off"
                    autocorrect="off"
                    spellcheck="false"
                >

                <p class="key-note">
                    Remember this key! You'll need it to decrypt.
                </p>

            </div>

            <button
                onclick="encryptText()"
                class="action-btn encrypt-action"
                id="encrypt-button"
            >
                <i class="fas fa-lock"></i> Encrypt Text
            </button>

            <div class="output-section">

                <h2>
                    <i class="fas fa-lock"></i> Encrypted Result
                </h2>

                <div
                    class="output-box"
                    id="encrypt-output"
                ></div>

                <button
                    onclick="copyResult()"
                    class="copy-btn"
                >
                    <i class="far fa-copy"></i> Copy Result
                </button>

            </div>

            <div class="nav-buttons">

                <a href="/" class="nav-btn">
                    <i class="fas fa-home"></i> Back to Home
                </a>

                <a href="/decrypt" class="nav-btn">
                    <i class="fas fa-unlock"></i> Go to Decryption
                </a>

            </div>

        </div>

    </div>

    <div id="notification" class="notification">

        <i class="fas fa-check-circle"></i>

        <span id="notification-text">
            Notification
        </span>

    </div>

    <script src="crypto.js"></script>
    <script src="password-tools.js"></script>
    <script>

        /**
         * Encrypt text locally using the browser Web Crypto API.
         */
        async function encryptText() {
            const text = document.getElementById('encrypt-text').value;
            const key = document.getElementById('encrypt-key').value;
            const button = document.getElementById('encrypt-button');
            const output = document.getElementById('encrypt-output');

            if (!text.trim()) {
                showNotification('Please enter text to encrypt!', 'error');
                return;
            }

            if (!key.trim()) {
                showNotification('Please enter a secret key!', 'error');
                return;
            }

            output.textContent = '';
            button.disabled = true;
            button.innerHTML = `
                <i class="fas fa-spinner fa-spin"></i>
                Encrypting...
            `;

            try {
                const result = await TextCrypto.encryptText(text, key);

                if (
                    typeof result !== 'string' ||
                    !result.startsWith('AES256GCM:v1:')
                ) {
                    throw new Error('Invalid encrypted result.');
                }

                output.textContent = result;

                showNotification(
                    'Text encrypted successfully on this device!',
                    'success'
                );

            } catch (error) {
                output.textContent = '';
                console.error('Encryption error:', error);

                showNotification(
                    error.message || 'Failed to encrypt text',
                    'error'
                );

            } finally {
                button.disabled = false;
                button.innerHTML = `
                    <i class="fas fa-lock"></i>
                    Encrypt Text
                `;
            }
        }

        /**
         * Copy encrypted text using a temporary textarea.
         * Preserve every character exactly as generated.
         */
        async function copyResult() {

            const output = document.getElementById('encrypt-output');
            const text = output.textContent;

            if (!text || !text.trim()) {
                showNotification('Nothing to copy yet!', 'warning');
                return;
            }

            const temporaryTextArea = document.createElement('textarea');

            temporaryTextArea.value = text;
            temporaryTextArea.readOnly = true;

            temporaryTextArea.setAttribute('readonly', '');
            temporaryTextArea.setAttribute('spellcheck', 'false');
            temporaryTextArea.setAttribute('autocapitalize', 'off');

            temporaryTextArea.style.position = 'fixed';
            temporaryTextArea.style.top = '0';
            temporaryTextArea.style.left = '0';
            temporaryTextArea.style.width = '100%';
            temporaryTextArea.style.height = '100px';
            temporaryTextArea.style.fontSize = '16px';
            temporaryTextArea.style.opacity = '0.01';
            temporaryTextArea.style.zIndex = '-1';

            document.body.appendChild(temporaryTextArea);

            try {

                temporaryTextArea.focus();
                temporaryTextArea.select();
                temporaryTextArea.setSelectionRange(0, text.length);

                const copied = document.execCommand('copy');

                if (!copied) {
                    throw new Error('Copy operation failed');
                }

                showNotification(
                    'Copied exactly to clipboard!',
                    'success'
                );

            } catch (error) {

                console.error('Clipboard error:', error);

                showNotification(
                    'Copy failed. Please use normal text selection.',
                    'error'
                );

            } finally {

                temporaryTextArea.remove();

            }
        }


        /**
         * Display notification messages.
         */
        function showNotification(message, type = 'success') {

            const notification = document.getElementById('notification');
            const text = document.getElementById('notification-text');
            const icon = notification.querySelector('i');

            text.textContent = message;

            if (type === 'error') {

                icon.className = 'fas fa-exclamation-circle';
                notification.style.borderLeftColor = '#ff6b6b';

            } else if (type === 'warning') {

                icon.className = 'fas fa-exclamation-triangle';
                notification.style.borderLeftColor = '#ffa726';

            } else {

                icon.className = 'fas fa-check-circle';
                notification.style.borderLeftColor = '#4CAF50';

            }

            notification.classList.add('show');

            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }


        /**
         * Initialize page.
         */
        window.addEventListener('DOMContentLoaded', () => {

            document.getElementById('encrypt-output').textContent = '';

        });

    </script>

</body>
</html>
