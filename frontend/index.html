<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Encryption - Home</title>
    <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="theme.css">\n<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="theme.js"></script>\n</head>
<body>
    <div class="container">
        <div class="home-content">
            <h1>Encrypt and Decrypt Messages Securely</h1>
            <p class="subtitle">Choose what you want to do:</p>

            <div class="choice-cards">
                <!-- Encryption Card -->
                <a href="/encrypt" class="card">
                    <img src="encr.png" alt="Encryption">
                    <h2>Encryption</h2>
                    <p>Convert your text into secret code</p>
                    <div class="card-btn">Go to Encryption →</div>
                </a>

                <!-- Decryption Card -->
                <a href="/decrypt" class="card">
                    <img src="decr.png" alt="Decryption">
                    <h2>Decryption</h2>
                    <p>Convert secret code back to text</p>
                    <div class="card-btn">Go to Decryption →</div>
                </a>

                <!-- File Encryption Card -->
                <a href="/files" class="card file-encryption-card">
                    <img
                        src="https://cdn-icons-png.flaticon.com/512/337/337946.png"
                        alt="File encryption"
                    >
                    <h2>File Encryption</h2>
                    <p>Encrypt and decrypt files securely</p>
                    <div class="card-btn">Go to File Encryption →</div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
