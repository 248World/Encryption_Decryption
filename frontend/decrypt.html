
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CipherNest | Text Decryption</title>

    <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="preloader.css">
<link rel="stylesheet"
          href="/vendor/fontawesome/css/all.min.css">


    <script src="theme.js"></script>
</head>

<body>

    <div id="app-preloader" class="app-preloader" role="status" aria-live="polite">
        <div class="preloader-content">
            <div class="preloader-symbol-field" aria-hidden="true">
                <div class="preloader-orbit"></div>
                <span class="preloader-token token-lock"><img src="assets/lock.png" alt=""></span>
                <span class="preloader-token token-key"><img src="assets/key.png" alt=""></span>
                <span class="preloader-token token-hash"><img src="assets/hash.png" alt=""></span>
                <span class="preloader-token token-code"><img src="assets/code.png" alt=""></span>
                <div class="preloader-mark"><img src="assets/shield.png" alt="CipherNest"></div>
            </div>
            <p class="preloader-kicker">CipherNest</p>
            <h1>Your privacy starts here</h1>
            <p class="preloader-message">Preparing a safer space for your data.</p>
            <div class="preloader-progress" aria-hidden="true"><span></span></div>
        </div>
    </div>
    <script src="preloader.js"></script>


    <div class="container">

        <header class="page-header">

            <a href="/" class="back-btn">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>

            <h1>
                <i class="fas fa-unlock"></i> Decryption
            </h1>

            <p class="subtitle">
                Convert secret code back to readable text
            </p>

        </header>

        <div class="encryption-area">

            <div class="input-section">

                <h2>
                    <i class="fas fa-shield-alt"></i> Text to Decrypt
                </h2>

                <textarea
                    id="decrypt-text"
                    placeholder="Paste encrypted text here..."
                    autocapitalize="off"
                    autocorrect="off"
                    spellcheck="false"
                    autocomplete="off"
                ></textarea>

            </div>

            <div class="key-section">

                <h2>
                    <i class="fas fa-key"></i> Secret Key
                </h2>

                <input
                    type="password"
                    id="decrypt-key"
                    placeholder="Enter the same secret key"
                    autocomplete="off"
                    autocapitalize="off"
                    autocorrect="off"
                    spellcheck="false"
                >

                <p class="key-note">
                    Must be the same key used for encryption.
                </p>

            </div>

            <button
                class="action-btn decrypt-action"
                id="decrypt-button"
            >
                <i class="fas fa-unlock"></i> Decrypt Text
            </button>

            <div class="output-section">

                <h2>
                    <i class="fas fa-unlock"></i> Decrypted Result
                </h2>

                <div
                    class="output-box"
                    id="decrypt-output"
                ></div>

                <button id="decrypt-copy-button"
                    class="copy-btn"
                >
                    <i class="far fa-copy"></i> Copy Result
                </button>

            </div>

            <div class="nav-buttons">

                <a href="/" class="nav-btn">
                    <i class="fas fa-home"></i> Back to Home
                </a>

                <a href="/encrypt" class="nav-btn">
                    <i class="fas fa-lock"></i> Go to Encryption
                </a>

            </div>

        </div>

    </div>

    <div id="notification" class="notification">

        <i class="fas fa-check-circle"></i>

        <span id="notification-text">
            Notification
        </span>

    </div>

    <script src="crypto.js"></script>
    <script src="password-tools.js"></script>
    <script src="decrypt-page.js"></script>


</body>
</html>
