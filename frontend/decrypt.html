
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Decryption Page</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        #decrypt-text,
        #decrypt-key,
        #decrypt-output {
            text-transform: none !important;
            -webkit-text-size-adjust: 100%;
        }

        #decrypt-text {
            user-select: text;
            -webkit-user-select: text;
        }

        #decrypt-output {
            overflow-wrap: anywhere;
            user-select: text;
            -webkit-user-select: text;
        }
    </style>
</head>

<body>

    <div class="container">

        <header class="page-header">
            <a href="/" class="back-btn">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>

            <h1>
                <i class="fas fa-unlock"></i> Decryption
            </h1>

            <p class="subtitle">
                Convert secret code back to readable text
            </p>
        </header>

        <div class="encryption-area">

            <div class="input-section">
                <h2>
                    <i class="fas fa-shield-alt"></i> Text to Decrypt
                </h2>

                <textarea
                    id="decrypt-text"
                    placeholder="Paste encrypted text here..."
                    autocapitalize="off"
                    autocorrect="off"
                    spellcheck="false"
                    autocomplete="off"
                    style="text-transform: none;"
                ></textarea>
            </div>

            <div class="key-section">
                <h2>
                    <i class="fas fa-key"></i> Secret Key
                </h2>

                <input
                    type="password"
                    id="decrypt-key"
                    placeholder="Enter the same secret key"
                    autocomplete="off"
                    autocapitalize="off"
                    autocorrect="off"
                    spellcheck="false"
                >

                <p class="key-note">
                    Must be the same key used for encryption.
                </p>
            </div>

            <button
                onclick="decryptText()"
                class="action-btn decrypt-action"
                id="decrypt-button"
            >
                <i class="fas fa-unlock"></i> Decrypt Text
            </button>

            <div class="output-section">
                <h2>
                    <i class="fas fa-unlock"></i> Decrypted Result
                </h2>

                <div
                    class="output-box"
                    id="decrypt-output"
                ></div>

                <button
                    onclick="copyResult()"
                    class="copy-btn"
                >
                    <i class="far fa-copy"></i> Copy Result
                </button>
            </div>

            <div class="nav-buttons">
                <a href="/" class="nav-btn">
                    <i class="fas fa-home"></i> Back to Home
                </a>

                <a href="/encrypt" class="nav-btn">
                    <i class="fas fa-lock"></i> Go to Encryption
                </a>
            </div>

        </div>
    </div>

    <div id="notification" class="notification">
        <i class="fas fa-check-circle"></i>
        <span id="notification-text">Notification</span>
    </div>

    <script>

        const API_URL =
            (window.location.hostname === "localhost" ||
             window.location.hostname === "127.0.0.1")
                ? "http://localhost:5000"
                : "https://encryption-decryption-seven.vercel.app";


        async function decryptText() {

            const text = document.getElementById('decrypt-text').value;
            const key = document.getElementById('decrypt-key').value;

            const button = document.getElementById('decrypt-button');
            const output = document.getElementById('decrypt-output');

            if (!text.trim()) {
                showNotification('Please enter text to decrypt!', 'error');
                return;
            }

            if (!key.trim()) {
                showNotification('Please enter the secret key!', 'error');
                return;
            }

            output.textContent = '';

            button.disabled = true;

            button.innerHTML = `
                <i class="fas fa-spinner fa-spin"></i>
                Decrypting...
            `;

            try {

                const response = await fetch(
                    `${API_URL}/api/decrypt`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            text: text,
                            key: key
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || 'Decryption failed'
                    );
                }

                if (
                    typeof data.result !== 'string' ||
                    !Object.prototype.hasOwnProperty.call(data, 'result')
                ) {
                    throw new Error(
                        'The server returned an invalid decryption result.'
                    );
                }

                output.textContent = data.result;

                showNotification(
                    'Text decrypted successfully!',
                    'success'
                );

            } catch (error) {

                output.textContent = '';

                console.error('Decryption error:', error);

                showNotification(
                    error.message || 'Failed to decrypt text',
                    'error'
                );

            } finally {

                button.disabled = false;

                button.innerHTML = `
                    <i class="fas fa-unlock"></i>
                    Decrypt Text
                `;
            }
        }


        /**
         * Copy decrypted text exactly as displayed.
         */
        async function copyResult() {

            const output = document.getElementById('decrypt-output');
            const text = output.textContent;

            if (!text || !text.trim()) {
                showNotification('Nothing to copy yet!', 'warning');
                return;
            }

            try {

                if (navigator.clipboard && window.isSecureContext) {

                    await navigator.clipboard.writeText(text);

                } else {

                    const temporaryTextArea = document.createElement('textarea');

                    temporaryTextArea.value = text;
                    temporaryTextArea.setAttribute('readonly', '');
                    temporaryTextArea.style.position = 'fixed';
                    temporaryTextArea.style.opacity = '0';
                    temporaryTextArea.style.fontSize = '16px';

                    document.body.appendChild(temporaryTextArea);

                    temporaryTextArea.select();
                    temporaryTextArea.setSelectionRange(0, text.length);

                    const copied = document.execCommand('copy');

                    document.body.removeChild(temporaryTextArea);

                    if (!copied) {
                        throw new Error('Copy command failed');
                    }
                }

                showNotification('Copied exactly to clipboard!', 'success');

            } catch (error) {

                console.error('Clipboard error:', error);

                showNotification(
                    'Unable to copy. Please select and copy the text manually.',
                    'error'
                );
            }
        }


        function showNotification(message, type = 'success') {

            const notification = document.getElementById('notification');
            const text = document.getElementById('notification-text');
            const icon = notification.querySelector('i');

            text.textContent = message;

            if (type === 'error') {
                icon.className = 'fas fa-exclamation-circle';
                notification.style.borderLeftColor = '#ff6b6b';
            } else if (type === 'warning') {
                icon.className = 'fas fa-exclamation-triangle';
                notification.style.borderLeftColor = '#ffa726';
            } else {
                icon.className = 'fas fa-check-circle';
                notification.style.borderLeftColor = '#4CAF50';
            }

            notification.classList.add('show');

            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }


        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('decrypt-output').textContent = '';
        });

    </script>

</body>
</html>
